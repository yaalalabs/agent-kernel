[project]
name = "sandbox-identity-api"
version = "0.1.0"
description = "End-to-end Agent Kernel sandbox identity demo: run sandboxed code under the authenticated user's identity over REST"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[openai,api]>=0.9.0",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.9.0",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.black]
line-length = 120
target-version = ["py312"]
