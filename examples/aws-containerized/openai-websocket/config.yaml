logging:
  ak:
    level: DEBUG
session:
  type: dynamodb
  dynamodb:
    table_name: "ak-oai-ws-dev-examples-session_store"
execution:
  # "async": replies are pushed back over the WebSocket. With the default message_type
  # (complete) the full agent reply is one CHAT_RESPONSE message; message_type: delta
  # pushes each token as a separate STREAM_CHUNK message.
  mode: async

secret:
  provider:
    type: aws_ssm
  # prefix is injected by Terraform as AK_SECRET__PREFIX

# Who may connect. The $connect handshake validates the `?token=` query parameter through this
# provider and keys the connection by the principal's subject; WebSocket mode refuses to start
# without the block. The static provider maps one credential to the `demo-user` principal. The
# value is never written here: Terraform passes it to the container as the DEMO_AUTH_TOKEN
# environment variable (var.demo_auth_token), which the secret capability resolves at startup.
identity:
  provider:
    type: static
    static:
      principals:
        DEMO_AUTH_TOKEN:
          subject: demo-user
