logging:
  ak:
    level: DEBUG

session:
  type: dynamodb
  dynamodb:
    table_name: "ak-oai-ws-q-dev-stream-session_store"

execution:
  mode: async
  message_type: delta
  queues:
    # The transport every component of this deployment runs on. Mandatory: the queue URLs
    # below are injected per component, so only this declaration tells each process which
    # transport it is on.
    type: sqs
    input:
      url: "" # injected by Terraform via AK_EXECUTION__QUEUES__INPUT__URL
      max_receive_count: 4
    output:
      url: "" # injected by Terraform via AK_EXECUTION__QUEUES__OUTPUT__URL
      max_receive_count: 4

secret:
  provider:
    type: aws_ssm
  # prefix is injected by Terraform as AK_SECRET__PREFIX

# Who may connect. The $connect handshake validates the `?token=` query parameter through this
# provider and keys the connection by the principal's subject; WebSocket mode refuses to start
# without the block. The static provider maps one credential to the `demo-user` principal. The
# value is never written here: Terraform passes it to the container as the DEMO_AUTH_TOKEN
# environment variable (var.demo_auth_token), which the secret capability resolves at startup.
identity:
  provider:
    type: static
    static:
      principals:
        DEMO_AUTH_TOKEN:
          subject: demo-user
