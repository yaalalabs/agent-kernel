[project]
name = "api-smolagents-multimodal-example"
version = "0.1.0"
description = "smolagents multimodal example for Agent Kernel"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[api,smolagents,multimodal]>=0.9.5",
    "python-multipart>=0.0.12,<0.1.0",
    "smolagents<2.0.0",
]

[dependency-groups]
dev = [
    "agentkernel[test,smolagents]>=0.9.5",
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "httpx>=0.27.0,<0.29.0",
    "black==26.10.1",
    "isort>=5.0.0,<9.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]
