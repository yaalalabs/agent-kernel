[project]
name = "livekit-voice-example"
version = "0.1.0"
description = "Agent Kernel LiveKit Realtime Voice Example"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[livekit,openai,api] >=0.9.2"
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.9.2",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false

# The `livekit` extra is not in the published agentkernel release yet, so this example must build
# against the local checkout until it ships. Drop this override once that extra is on the index.
[tool.uv.sources]
agentkernel = { path = "../../../../../ak-py", editable = true }
