[project]
name = "api-slack"
version = "0.1.0"
description = "Demo of a Pydantic AI agent running with a Slack integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[api,pydanticai,slack]>=0.9.5",
    # agentkernel[pydanticai] installs the provider-agnostic pydantic-ai-slim core only — pick a
    # model provider explicitly. This demo uses OpenAI; swap for [anthropic], [google], etc.
    "pydantic-ai-slim[openai]>=2.13.0",
    # The REST handler registers a multipart upload route whenever the transport is in_memory.
    # agentkernel[api] does not declare it, and the OpenAI SDK is no longer here to pull it in.
    "python-multipart>=0.0.12",
    "aiohttp>=3.14.1",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.9.5",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]
