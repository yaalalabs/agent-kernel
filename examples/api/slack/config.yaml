# Core settings
logging:
  ak:
    level: DEBUG
library_version: "0.1.0"

# Slack integration settings
slack:
  agent_acknowledgement: "I'm processing your request"
  # Keys the Slack credentials are read from through the secret manager when the matching
  # field (bot_token, ...) is unset: the environment first, then the configured secret provider
  bot_token_key: SLACK_BOT_TOKEN
  signing_secret_key: SLACK_SIGNING_SECRET
