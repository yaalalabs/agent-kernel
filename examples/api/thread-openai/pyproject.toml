[project]
name = "api-thread-openai"
version = "0.1.0"
description = "Demo of conversation thread support with OpenAI Agents SDK agents in Agent Kernel with a REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[openai,api,thread]>=0.8.0",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.8.0",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]
