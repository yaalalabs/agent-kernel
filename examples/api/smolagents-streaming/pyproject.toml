[project]
name = "api-smolagents-streaming"
version = "0.1.0"
description = "smolagents token streaming over SSE through the Agent Kernel REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[api,smolagents]>=0.9.5",
    # smolagents installs its model providers as extras; this demo uses LiteLLMModel with OpenAI.
    "smolagents[litellm]>=1.26.0",
    # The REST API needs it for its multipart route; other API examples get it via their framework extra.
    "python-multipart>=0.0.12",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.9.5",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]
