# Chart overlay for this example: layered on top of the chart's dev flavor (values-dev.yaml)
# by deploy/deploy.sh, it wires the two example images and the OpenAI credentials Secret. The WebSocket and
# Kafka walkthroughs add their overrides as --set flags on the same script.

image:
  tag: dev
  pullPolicy: Never # the images are imported into the cluster, never pulled

ioHandler:
  image:
    repository: ak-example-io-handler

agentRunner:
  image:
    repository: ak-example-agent-runner

# The agent runner reads OPENAI_API_KEY from this Secret's mounted file (secret.provider.type:
# kubernetes in config.*.yaml); the data key must be named OPENAI_API_KEY.
secretStore:
  enabled: true
  secrets:
    - name: openai-credentials

# The identity block in config.*.yaml names the DEMO_AUTH_TOKEN credential, and the io handler and
# the WebSocket gateway build the provider at startup, so the value must reach every tier. The
# secretStore mount above reaches only the agent-executing tier, so the token travels as an
# environment variable instead, read from the demo-credentials Secret (see the README).
extraEnv:
  - name: DEMO_AUTH_TOKEN
    valueFrom:
      secretKeyRef:
        name: demo-credentials
        key: DEMO_AUTH_TOKEN
