# Default: no external service required, and sessions are lost on restart.
session:
  type: in_memory

# Redis (survives restart): uncomment the block below, comment out `type: in_memory` above,
# and set `type: redis`.
# session:
#   type: redis
#   redis:
#     url: redis://localhost:6379
#     ttl: 604800
#     prefix: "ak:sessions:"

# Valkey (same as Redis, open-source): uncomment the block below, comment out `type: in_memory`
# above, and set `type: valkey`.
# session:
#   type: valkey
#   valkey:
#     url: valkey://localhost:6379
#     ttl: 604800
#     prefix: "ak:sessions:"
