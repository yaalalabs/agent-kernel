[project]
name = "aws-serverless-openai-valkey"
version = "0.1.0"
description = "Demo of OpenAI Agents SDK based agents running in Agent Kernel on AWS Lambda with Valkey session storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[openai,valkey]>=0.6.1",
    # The published agentkernel 0.6.1 does not declare a `valkey` extra (added after release),
    # so `agentkernel[valkey]` resolves to nothing from PyPI. Require valkey directly so it is
    # always installed into the Lambda deployment package.
    "valkey>=6.0.0",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.6.1",
    # ragas imports langchain_community.chat_models.vertexai, removed in langchain-community 0.4.2
    "langchain-community==0.4.1",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]
