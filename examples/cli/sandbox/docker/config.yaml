# Docker provider demo: container-isolated sandboxes.
#
# Each sandbox is its own container (created from `image`, kept alive with
# `sleep infinity`); executions are exec calls inside it and files live under
# /workspace. Requires the `sandbox-docker` extra and a running Docker daemon.
#
# Two profiles show what an isolating provider adds over local_subprocess:
#   - default : a per-session container workspace; files persist across turns, and the
#               container survives idle CLI pauses for up to idle_timeout.
#   - offline : the same, but with `network_egress: deny` — docker ENFORCES this
#               (network_mode: none), unlike local_subprocess where the identical
#               policy can only fail closed (see ../policy).
sandbox:
  enabled: true
  profiles:
    default:
      type: docker
      idle_timeout: 21600 # 6 hours; an idle-expired container is removed and the workspace resets
      docker:
        image: python:3.12-slim
    offline:
      type: docker
      policy:
        network_egress: deny # -> container network_mode: none (actually enforced)
      docker:
        image: python:3.12-slim
  broker:
    flavor: thread
