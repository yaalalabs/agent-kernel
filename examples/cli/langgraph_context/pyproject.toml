[project]
name = "cli-langgraph-context"
version = "0.1.0"
description = "Demo of per-run framework context/state carried across turns by a custom LangGraph agent in Agent Kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[cli,langgraph]>=0.8.0",
    "langchain-openai>=1.1.16",
    "openai>=1.99.1",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.7.0",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false
# ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in langchain-community 0.4.2
# langgraph-prebuilt >=1.0.9 imports ExecutionInfo/ServerInfo from langgraph.runtime, which only exists in
# langgraph >=1.1; agentkernel pins langgraph~=1.0.5, so keep prebuilt at the last compatible release
constraint-dependencies = ["langchain-community<0.4.2", "langgraph-prebuilt<=1.0.8"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]
