[project]
name = "cli-langgraph-context"
version = "0.1.0"
description = "Demo of per-run framework context/state carried across turns by a custom LangGraph agent in Agent Kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[cli,langgraph]>=0.8.1",
    "langchain-openai>=1.1.16",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.8.1",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false
# ragas 0.4.3 requires a removed langchain-community module.
# langgraph-prebuilt >=1.0.9 requires langgraph >=1.1, so pin it for langgraph 1.0 compatibility.
# ak-py now uses langgraph~=1.2.10 (#586), but PyPI 0.8.1 still caps it at ~=1.0.5.
# Remove this pin once a release with the new langgraph constraint is published.
constraint-dependencies = ["langchain-community<0.4.2", "langgraph-prebuilt<=1.0.8"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]
