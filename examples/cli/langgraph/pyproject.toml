[project]
name = "cli-langgraph"
version = "0.1.0"
description = "Demo of LangGraph based agents running in Agent Kernel with a CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[cli,langgraph]>=0.10.0",
    "langchain-litellm>=0.2.2,<0.4.0",
    "langchain-openai>=1.1.16,<2.0.0",
    "langgraph-supervisor>=0.0.29,<0.1.0",
    "openai>=1.99.1,<3.0.0",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.10.0",
    "black==26.10.1",
    "isort>=5.0.0,<8.0.0",
    "mypy>=1.0.0,<2.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]
