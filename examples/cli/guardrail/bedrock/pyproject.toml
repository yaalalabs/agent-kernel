[project]
name = "guardrail-bedrock"
version = "0.1.0"
description = "Demo of LangGraph based agents running in Agent Kernel with AWS Bedrock Guardrails enabled"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[cli,langgraph,aws]>=0.8.1",
    "langchain-litellm>=0.2.2",
    "langchain-openai>=1.1.16",
    "langgraph-supervisor>=0.0.29",
    "openai>=1.99.1",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.8.1",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false
# langgraph-prebuilt >=1.0.9 imports ExecutionInfo/ServerInfo from langgraph.runtime, which only exists in
# langgraph >=1.1; the published agentkernel pins langgraph~=1.0.5, so keep prebuilt at the last compatible release
constraint-dependencies = ["langgraph-prebuilt<=1.0.8"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]
