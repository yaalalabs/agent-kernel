# Agent Kernel test harness configuration (loaded only when running tests).
# See https://kernel.yaala.ai/docs/testing/overview for details.
mode: fallback  # Test comparison mode: score, llm, or fallback (default: fallback)
# Bring-your-own evaluator: a dotted path to an AKEvaluator subclass, resolved against
# custom_evaluator.py next to this file (see that file for the implementation).
evaluator: custom_evaluator.TokenOverlapEvaluator
# LLM settings are read by TokenOverlapEvaluator.llm_based_evaluation for its judge call:
llm:
  model: gpt-4o-mini
  provider: openai
