[project]
name = "cli-crewai"
version = "0.1.0"
description = "Demo of CrewAI based agents running in Agent Kernel with a CLI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agentkernel[cli,crewai]>=0.8.1",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.8.1",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false
# crewai's chromadb~=1.1.0 pin requires posthog<6.0.0; deepeval (via agentkernel[test]) requires
# posthog>=7.0.0,<8.0.0. Both only use posthog for anonymous telemetry, so forcing the newer
# version is low-risk. Mirrors the same override in ak-py/pyproject.toml.
override-dependencies = ["posthog>=7.0.0,<8.0.0"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]