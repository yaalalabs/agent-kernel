# Agent Kernel test harness configuration (loaded only when running tests).
# See https://kernel.yaala.ai/docs/testing/overview for details.
# The jev evaluator is a hosted judge (TypeSafe JEV) with no score-based metric, so it only works in llm mode:
# score and fallback raise AKMetricNotSupported. It reads TYPESAFE_API_KEY from the environment and does not use
# an llm: block (the agent under test still needs OPENAI_API_KEY).
mode: llm
evaluator: jev
