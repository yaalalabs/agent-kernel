logging:
  ak:
    level: DEBUG
session:
  type: redis
  redis:
    prefix: "ak:openai:streaming:example:"
    url: "redis://ak-openai-serverless-dev-examples-redis.qaandw.0001.apse2.cache.amazonaws.com:6379"
execution:
  mode: async
  message_type: delta
  queues:
    # The transport every component of this deployment runs on. Mandatory: the queue URLs
    # below are injected per component, so only this declaration tells each process which
    # transport it is on.
    type: sqs
    input:
      # url: "https://sqs.<region>.amazonaws.com/<account-id>/<input-queue-name>"
      max_receive_count: 3
    output:
      # url: "https://sqs.<region>.amazonaws.com/<account-id>/<output-queue-name>"
      max_receive_count: 3

# Who may connect. The $connect handshake validates the `?token=` query parameter through this
# provider and keys the connection by the principal's subject; the connection handler refuses to
# build without the block. The static provider maps one credential to the `demo-user` principal.
# The value is never written here: Terraform passes it to the connection-handler Lambda as the
# DEMO_AUTH_TOKEN environment variable (var.demo_auth_token), which the secret capability resolves
# at startup. The other Lambdas load this file without needing the variable.
identity:
  provider:
    type: static
    static:
      principals:
        DEMO_AUTH_TOKEN:
          subject: demo-user
