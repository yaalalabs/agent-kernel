logging:
  ak:
    level: DEBUG
session:
  type: redis
  redis:
    prefix: "ak:openai:example:"
    url: "redis://ak-openai-serverless-dev-examples-redis.zinik6.0001.apse2.cache.amazonaws.com:6379"
execution:
  mode: rest_sync
  queues:
    # The transport every component of this deployment runs on. Mandatory: the queue URLs
    # below are injected per component, so only this declaration tells each process which
    # transport it is on.
    type: sqs
    input:
      # url injected via AK_EXECUTION__QUEUES__INPUT__URL
      max_receive_count: 3
    output:
      # url injected via AK_EXECUTION__QUEUES__OUTPUT__URL
      max_receive_count: 3
  response_store:
    type: redis
    redis:
      prefix: "ak:openai:response:"
      url: "redis://ak-openai-serverless-dev-examples-redis.zinik6.0001.apse2.cache.amazonaws.com:6379"
    retry_count: 6
    delay: 10