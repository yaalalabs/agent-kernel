[project]
name = "aws-serverless-scalable-openai"
version = "0.1.0"
description = "Demo of OpenAI Agents SDK based agents running in Agent Kernel on AWS Lambda with scalable queue processing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Per-Lambda dependency sets. The request/response handlers only enqueue and
# dequeue work, so they omit the (heavy) OpenAI Agents SDK; only the agent
# runner needs it. deploy.sh installs each package with `uv export --extra <name>`.
request_handler = [
    "agentkernel[aws,redis]>=0.7.0",
]
response_handler = [
    "agentkernel[aws,redis]>=0.7.0",
]
agent_runner = [
    "agentkernel[aws,openai,redis]>=0.7.0",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.7.0",
    "black==26.5.1",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 120
target-version = ["py312"]
