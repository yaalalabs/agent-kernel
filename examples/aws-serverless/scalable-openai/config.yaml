logging:
  ak:
    level: DEBUG
session:
  type: redis
  redis:
    prefix: "ak:scalable-openai:example:"
    url: "redis://ak-openai-serverless-dev-examples-redis.zinik6.0001.apse2.cache.amazonaws.com:6379"
execution:
  mode: rest_sync
  queues:
    # The transport every component of this deployment runs on. Mandatory: the queue URLs
    # below are injected per component, so only this declaration tells each process which
    # transport it is on.
    type: sqs
    input:
      # url: "https://sqs.<region>.amazonaws.com/<account-id>/<input-queue-name>"
      max_receive_count: 3
    output:
      # url: "https://sqs.<region>.amazonaws.com/<account-id>/<output-queue-name>"
      max_receive_count: 3
  response_store:
    type: redis
    redis:
      prefix: "ak:scalable-openai:response:"
      url: "redis://ak-openai-serverless-dev-examples-redis.zinik6.0001.apse2.cache.amazonaws.com:6379"
    retry_count: 6
    delay: 10