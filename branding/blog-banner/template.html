<!doctype html>
<html lang="en">
  <!--
    The blog banner template for Open Agent Kernel (OAK). One page, 1600 by 840 CSS px.
    render.mjs opens it once per entry in banners.json and passes the entry as the query string:
      label     short topic label for the pill, for example "Observability"
      title     the headline, in sentence case
      accent    optional last words of the headline, set in the accent colour
      subtitle  one line under the headline
      drawing   build, connect, remember, guard, scale or observe
    Open it in a browser with the same query string to preview a banner.
  -->
  <head>
    <meta charset="utf-8" />
    <title>Blog banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=block" rel="stylesheet" />
    <style>
      /* The palette is the one in branding/README.md */
      :root {
        --orange: #ff5e32;
        --prussian: #02284f;
        --dusk: #3f598a;
        --sky: #abcee1;
        --ice: #b1cdff;
        --paper: #f7fafe;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 1600px;
        height: 840px;
        overflow: hidden;
        font-family: 'Archivo', sans-serif;
        color: var(--prussian);
        background-color: var(--paper);
        /* The fine dot grid of the earlier banners */
        background-image: radial-gradient(rgba(63, 89, 138, 0.16) 1.2px, transparent 1.3px);
        background-size: 32px 32px;
        background-position: 16px 12px;
      }

      /* The side margins are wide on purpose: the blog index shows a banner as a 3:2 thumbnail,
         which trims about 166 px from each side. Nothing that matters sits in that strip. */
      .banner {
        display: grid;
        grid-template-columns: 716px 1fr;
        column-gap: 56px;
        height: 100%;
        padding: 88px 176px 80px;
      }

      .copy {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .brand img {
        display: block;
        height: 68px;
        width: auto;
      }

      .pill {
        padding: 9px 18px 8px;
        border-radius: 999px;
        background-color: var(--ice);
        font-family: 'JetBrains Mono', monospace;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--prussian);
      }

      h1 {
        margin-top: 72px;
        font-size: 104px;
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      h1 em {
        font-style: normal;
        color: var(--orange);
      }

      .subtitle {
        max-width: 660px;
        margin-top: 36px;
        font-size: 31px;
        line-height: 1.4;
        color: #475b7a;
        text-wrap: pretty;
      }

      .site {
        margin-top: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        color: #7d8fab;
      }

      /* The drawing: one still from the stage drawings of the website, in a card */
      .art {
        align-self: center;
        padding: 40px 28px;
        border: 2px solid #d3e0f5;
        border-radius: 28px;
        background-color: #fff;
      }

      .art svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .rail,
      .faint,
      .outline,
      .port,
      .accent,
      .accentKnock {
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .rail {
        stroke: rgba(63, 89, 138, 0.6);
      }

      .faint {
        stroke: rgba(63, 89, 138, 0.3);
      }

      .outline,
      .port {
        stroke: var(--dusk);
        fill: #fff;
      }

      .dot {
        fill: var(--dusk);
      }

      .accent {
        stroke: var(--orange);
      }

      .accentKnock {
        stroke: var(--orange);
        fill: #fff;
      }

      .dotAccent {
        fill: var(--orange);
      }
    </style>
  </head>
  <body>
    <main class="banner">
      <div class="copy">
        <div class="brand">
          <img src="../primary/open-agent-kernel-color.svg" alt="Open Agent Kernel" />
          <span class="pill" id="label"></span>
        </div>
        <h1 id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
        <p class="site">kernel.yaala.ai</p>
      </div>
      <div class="art" id="art"></div>
    </main>

    <script>
      const entry = new URLSearchParams(location.search);
      const text = (name, fallback) => entry.get(name) || fallback;

      document.getElementById('label').textContent = text('label', 'Label');
      document.getElementById('subtitle').textContent = text('subtitle', 'One line under the headline.');

      // A hyphenated word stays on one line: the hyphen is swapped for its non-breaking twin.
      const whole = (words) => words.replace(/-/g, '\u2011');
      const title = document.getElementById('title');
      title.textContent = whole(text('title', 'The headline'));
      if (entry.get('accent')) {
        const accent = document.createElement('em');
        accent.textContent = whole(entry.get('accent'));
        title.append(' ', accent);
      }

      const drawing = document.getElementById(`drawing-${text('drawing', 'build')}`) || document.getElementById('drawing-build');
      document.getElementById('art').append(drawing.content.cloneNode(true));

      // A long headline steps down in size until it fits the column in three lines.
      document.fonts.ready.then(() => {
        let size = 104;
        const tooBig = () => title.getBoundingClientRect().height > size * 0.98 * 3 + 4 || title.scrollWidth > title.clientWidth + 1;
        while (tooBig() && size > 64) {
          size -= 4;
          title.style.fontSize = `${size}px`;
        }
      });
    </script>
  </body>
</html>
