[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[project]
name = "agentkernel"
version = "0.9.5"
description = "Agent Kernel - Unified AI Agents Runtime"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Yaala Labs", email = "agentkernel@yaalalabs.com" }
]
dependencies = [
    "deprecated>=1.2.18,<2.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "singleton-type>=0.0.5,<0.1.0",
]

[project.optional-dependencies]
auth = [
    "PyJWT>=2.15.0,<3.0.0",
    "cryptography>=42.0,<51.0.0",
    "httpx>=0.27.0,<0.29.0",
]
langfuse = [
    "langfuse>=4.2.0,<5.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]
openllmetry = [
    "traceloop-sdk>=0.61.0,<0.63.0",
    "httpx>=0.27.0,<0.29.0",
]
logfire = [
    "logfire>=4.31.0,<5.0.0",
    "httpx>=0.27.0,<0.29.0",
]
cloudwatch = [
    "opentelemetry-sdk>=1.30.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0,<2.0.0",
    "botocore>=1.41.4,<2.0.0",
    "requests>=2.32.0,<3.0.0",
]
crewai = [
    "crewai>=1.15.0,<2.0.0",
    "openinference-instrumentation-crewai>=0.1.16,<2.0.0",
    "openinference-instrumentation-litellm>=0.1.28,<0.2.0",
]
langgraph = [
    "langgraph>=1.2.14,<1.3",
    "langgraph-prebuilt~=1.1.0",
    "langchain~=1.3.10",
    "langchain_community~=0.4.1",
    "litellm>=1.100.3,<2.0.0"
]
smolagents = [
    "smolagents>=1.26.0,<2.0.0",
]
pydanticai = [
    "pydantic-ai-slim~=2.13.0",
    "openinference-instrumentation-pydantic-ai>=0.1.17,<0.2.0",
]
maf = [
    "agent-framework-core>=1.20.0,<2",
]
claude = [
    "claude-agent-sdk>=0.2.165,<0.3",
    "openinference-instrumentation-claude-agent-sdk>=0.1.20,<0.2.0",
]
cli = [
    
]
livekit = [
    "livekit-api>=0.4.0,<2.0.0",
    "livekit>=0.18.0,<2.0.0",
]
aws = [
    "boto3>=1.41.4,<2.0.0",
]

azure = [
    "azure-functions>=1.24.0,<3.0.0",
    "azure-data-tables>=12.4.0,<13.0.0",
    "azure-core>=1.26.0,<2.0.0"
]
redis = [
    "redis>=7.1.0,<9.0.0",
