    "httpx>=0.27.0,<0.29.0",
    "fastapi>=0.118.0,<0.142.0",
    "aiohttp>=3.14.4,<4.0.0",
]
whatsapp = [
    "httpx>=0.27.0,<0.29.0",
    "fastapi>=0.118.0,<0.142.0",
]
messenger = [
    "httpx>=0.27.0,<0.29.0",
    "fastapi>=0.118.0,<0.142.0",
]
instagram = [
    "httpx>=0.27.0,<0.29.0",
    "fastapi>=0.118.0,<0.142.0",
]
telegram = [
    "httpx>=0.27.0,<0.29.0",
    "fastapi>=0.118.0,<0.142.0",
]
teams = [
    "botbuilder-core>=4.17.0,<5.0.0",
    "botbuilder-schema>=4.17.0,<5.0.0",
    "aiohttp>=3.14.4,<4.0.0",
    "msal>=1.31.1,<2.0.0",
    "httpx>=0.27.0,<0.29.0",
    "fastapi>=0.118.0,<0.142.0",
]
gmail = [
    "google-auth>=2.0.0,<3.0.0",
    "google-auth-oauthlib>=1.0.0,<2.0.0",
    "google-auth-httplib2>=0.2.0,<0.5.0",
    "google-api-python-client>=2.0.0,<3.0.0",
]
gcp = [
    "google-cloud-firestore>=2.19.0,<3.0.0",
]
test = [
    "pytest>=8.4.1,<10.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "pytest-cov>=6.2.1,<8.0.0",
    "pytest-html>=4.1.1,<5.0.0",
    "pytest-order>=1.3.0,<2.0.0",
    "deepeval>=4.1.4,<5.0.0",
    "litellm>=1.100.3,<2.0.0",
]
a2a = [
    "a2a-sdk[http-server]==1.2.3",
    "fastapi>=0.118.0,<0.142.0",
    "uvicorn>=0.37.0,<0.53.0",
]
mcp = [
    "fastmcp>=3.4.10,<4.0.0"
]
multimodal = [
    "litellm>=1.100.3,<2.0.0",
    "python-multipart>=0.0.12,<0.1.0",
]
sandbox-docker = [
    "docker>=7.0.0,<8.0.0",
]
e2b = [
    "e2b-code-interpreter>=2.8.0,<3.0.0",
]
daytona = [
    # <0.199: from 0.199 the daytona api clients require pydantic>=2.13.4, which conflicts
    # with crewai's pydantic<2.13 pin; 0.198 accepts pydantic>=2.11 and has the same SDK surface.
    "daytona>=0.198.0,<0.199",
]
kubernetes = [
    "kubernetes>=29.0.0,<37.0.0",
]
opik = [
    "opik>=1.10.0,<3.0.0",
]
jev = [
    "typesafe-sdk>=0.7.2,<0.8",
]

[project.scripts]
ak = "agentkernel.cli.ak:main"

[dependency-groups]
dev = [
    "black==26.10.1",
    "isort>=5.0.0,<10.0.0",
    "mypy>=1.0.0,<3.0.0",
    "ruff==0.17.1",
]


[tool.uv]
package = true
# crewai (posthog<6.0.0 via chromadb) and test (posthog>=7.0.0 via deepeval) are never installed together, so don't require a joint resolution
conflicts = [
    [
        { extra = "crewai" },
        { extra = "test" },
    ],
]

[tool.isort]
profile = "black"
line_length = 150

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.black]
line-length = 150
target-version = ["py312"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
# Only the pyupgrade typing rules (PEP 585/604 annotations, collections.abc imports): black and isort own
# formatting and import order. Keep in sync with RUFF_RULES in the root Makefile, which lints examples.
select = ["UP006", "UP007", "UP035", "UP045"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term --cov-report=html --html=report.html"
# CI runs everything; `-m "not slow"` is for a local run that should not spend a minute
# materialising a 10,000-concept bundle.
markers = ["slow: builds a large fixture on disk or otherwise takes tens of seconds"]
