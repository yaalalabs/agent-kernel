[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[project]
name = "ak-bench"
version = "0.1.0"
description = "Agent Kernel benchmark harness"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agentkernel",
    "pydantic>=2.11.7,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "numpy>=2.0,<3.0",
    "matplotlib>=3.9,<4.0",
    "websockets>=13.0,<16.0",
]

[project.scripts]
ak-bench = "ak_bench.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio>=1.2.0,<2.0.0", "ruff==0.17.1"]

[tool.uv.sources]
agentkernel = { path = "../ak-py", editable = true }

[tool.uv.build-backend]
module-name = "ak_bench"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 150
