[project]
name = "ak-bench-app"
version = "0.1.0"
description = "Agent Kernel benchmark app: the mock agent (or a real OpenAI agent) behind signed bench tokens"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[api,openai]",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio>=1.2.0,<2.0.0"]

[tool.uv]
package = false

[tool.uv.sources]
agentkernel = { path = "../../ak-py", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
