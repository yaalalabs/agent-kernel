name: Reusable Test Workflow

# This is a reusable workflow that contains all the test jobs
# It can be called by other workflows with different triggers and contexts

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'The git ref to checkout (commit SHA, branch, or tag)'
        required: true
        type: string
      run_e2e_tests:
        description: 'Whether to run e2e tests (requires secrets)'
        required: false
        type: boolean
        default: true
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      WALLED_API_KEY:
        required: false
      SLACK_BOT_TOKEN:
        required: false
      SLACK_SIGNING_SECRET:
        required: false

jobs:
  setup:
    if: ${{ inputs.run_e2e_tests }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install pyyaml
      
      - name: Generate test matrix
        id: set-matrix
        run: |
          python3 .github/scripts/generate_test_matrix.py --tier e2e --format github >> $GITHUB_OUTPUT

  build-ak-py:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Build ak-py
        working-directory: ak-py
        run: ./build.sh

      # Run-scoped artifact, not actions/cache (CodeQL actions/cache-poisoning): this workflow is
      # called with an arbitrary checkout_ref from privileged contexts (workflow_dispatch on the
      # default branch, pull_request_target for labelled fork PRs), so a cache write here could
      # poison an entry the default branch later restores. Artifacts are scoped to this run.
      - name: Upload ak-py build
        uses: actions/upload-artifact@v6
        with:
          name: ak-py-dist
          path: ak-py/dist
          retention-days: 1
          if-no-files-found: error

  script-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test bump_version script
        working-directory: scripts
        run: python test_bump_version.py
      
      - name: Test update_terraform_versions script
        working-directory: scripts
        run: python test_update_terraform_versions.py

      - name: Test update_skills_version script
        working-directory: scripts
        run: python test_update_skills_version.py

  unit-tests:
    needs: [build-ak-py]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Download ak-py build
        uses: actions/download-artifact@v6
        with:
          name: ak-py-dist
          path: ak-py/dist

      - name: Test ak-py
        working-directory: ak-py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./build.sh && uv run pytest -s

  transport-integration-tests:
    # The QueueTransportContract against REAL brokers (spec #495 Testing): the unit suite runs
    # the same contract against in-memory fakes; this job points it at live NATS and Kafka
    # containers (the transport examples' compose stacks), which catches what fakes cannot:
    # consumer-group membership, server-side ack_wait timing, metadata propagation, real
    # partitioners.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Start brokers
        run: |
          docker compose -f examples/transport/nats/docker-compose.yaml up -d --wait nats
          docker compose -f examples/transport/kafka/docker-compose.yaml up -d --wait kafka

      - name: Run transport contract against live brokers
        working-directory: ak-py
        env:
          AK_TEST_NATS_URL: nats://localhost:4222
          AK_TEST_KAFKA_BOOTSTRAP: localhost:9092
        run: |
          ./build.sh
          uv run pytest tests/test_transport_contract_live.py --no-cov -v

      - name: Stop brokers
        if: always()
        run: |
          docker compose -f examples/transport/nats/docker-compose.yaml down -v
          docker compose -f examples/transport/kafka/docker-compose.yaml down -v

  e2e-tests:
    needs: [setup, build-ak-py]
    if: ${{ inputs.run_e2e_tests && fromJson(needs.setup.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Download ak-py build
        uses: actions/download-artifact@v6
        with:
          name: ak-py-dist
          path: ak-py/dist

      - name: Run test - ${{ matrix.path }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WALLED_API_KEY: ${{ secrets.WALLED_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        run: |
          python .github/scripts/run_single_test.py \
            --type ${{ matrix.type }} \
            --path ${{ matrix.path }} \
            --action test

