name: Deploy GitHub Pages

on:
  push:
    branches:
      - develop
    paths:
      - 'docs/**'
      # Merging a sync-state PR doesn't need a redeploy.
      - '!docs/blog/.devto-sync-state.json'
      - '!docs/blog/.hashnode-sync-state.json'
  workflow_dispatch:
    inputs:
      # The Hashnode sync is disabled for now (see the commented-out sync-hashnode job).
      # hashnode_post:
      #   description: 'Sync only this blog file to Hashnode (e.g. 2026-09-14-scheduled-tasks.md). Leave empty to sync all new/changed posts.'
      #   required: false
      #   default: ''
      devto_post:
        description: 'Sync only this blog file to DEV Community (e.g. 2026-09-14-scheduled-tasks.md). Leave empty to sync all new/changed posts.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # DEV Community and Hashnode can't display SVG images, so a blog post using one stops the
      # deploy here, before the website or any article is published.
      - name: Check blog posts for SVG images
        working-directory: .
        run: |
          pip install -r scripts/sync_blogs/requirements.txt
          python scripts/sync_blogs/check_images.py
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build website
        run: npm run build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Disabled for now: we only publish to DEV Community at the moment. Before re-enabling, move its
