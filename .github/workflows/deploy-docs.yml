name: Deploy GitHub Pages

on:
  push:
    branches:
      - develop
    paths:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      hashnode_post:
        description: 'Sync only this blog file to Hashnode (e.g. 2026-09-14-scheduled-tasks.md). Leave empty to sync all new/changed posts.'
        required: false
        default: ''
      devto_post:
        description: 'Sync only this blog file to DEV Community (e.g. 2026-09-14-scheduled-tasks.md). Leave empty to sync all new/changed posts.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build website
        run: npm run build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  sync-hashnode:
    name: Sync blog posts to Hashnode
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Configure git
        run: |
          git config user.name "agent-kernel-ci[bot]"
          git config user.email "agent-kernel-ci[bot]@users.noreply.github.com"

      - name: Publish new and update changed posts on Hashnode
        env:
          HASHNODE_PAT: ${{ secrets.HASHNODE_PAT }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          HASHNODE_POST: ${{ inputs.hashnode_post }}
        run: |
          if [ -z "$HASHNODE_PAT" ] || [ -z "$HASHNODE_PUBLICATION_ID" ]; then
            echo "HASHNODE_PAT / HASHNODE_PUBLICATION_ID secrets are not set - skipping Hashnode sync."
            exit 0
          fi
          if [ -n "$HASHNODE_POST" ]; then
            python scripts/sync_hashnode_blog.py --post "$HASHNODE_POST"
          else
            python scripts/sync_hashnode_blog.py
          fi

      - name: Commit updated Hashnode sync state
        if: always()
        run: |
          if [ -n "$(git status --porcelain docs/blog/.hashnode-sync-state.json)" ]; then
            git add docs/blog/.hashnode-sync-state.json
            git commit -m "chore: record blog posts synced to Hashnode"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          else
            echo "No Hashnode sync state changes."
          fi

  sync-devto:
    name: Sync blog posts to DEV Community
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Configure git
        run: |
          git config user.name "agent-kernel-ci[bot]"
          git config user.email "agent-kernel-ci[bot]@users.noreply.github.com"

      - name: Publish new and update changed posts on DEV Community
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_ORGANIZATION_ID: ${{ secrets.DEVTO_ORGANIZATION_ID }}
          DEVTO_POST: ${{ inputs.devto_post }}
        run: |
          if [ -z "$DEVTO_API_KEY" ]; then
            echo "DEVTO_API_KEY secret is not set - skipping DEV Community sync."
            exit 0
          fi
          if [ -n "$DEVTO_POST" ]; then
            python scripts/sync_devto_blog.py --post "$DEVTO_POST"
          else
            python scripts/sync_devto_blog.py
          fi

      - name: Commit updated DEV Community sync state
        if: always()
        run: |
          if [ -n "$(git status --porcelain docs/blog/.devto-sync-state.json)" ]; then
            git add docs/blog/.devto-sync-state.json
            git commit -m "chore: record blog posts synced to DEV Community"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          else
            echo "No DEV Community sync state changes."
          fi
