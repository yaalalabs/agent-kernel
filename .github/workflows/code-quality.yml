name: Code Quality

on:
  pull_request:
    branches:
      - develop

# Least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions): checkout only.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run lint checks
        run: make lint-check-all

      # Here, not in test-reusable.yaml's script-tests: that job also runs from privileged triggers on a
      # checkout_ref, which CodeQL flags (actions/cache-poisoning/poisonable-step); this workflow runs only on
      # pull_request with a read-only token.
      - name: Test the dependency update script
        run: uv run --no-project --with "packaging==26.3" python -m unittest discover -s .github/scripts/tests -p "test_dependency_caps*.py"
