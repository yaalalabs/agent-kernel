name: Dependency Version Update (Copilot)

# Weekly, for every manifest the same way: upper limits, security fixes, and updates on each version
# line (scripts/dependency_caps.py). The branch then runs the same CI jobs a PR runs: unit tests, e2e,
# kind smoke tests, lint. The PR opens only when they pass. On a failure Copilot names the package
# behind each real error (it edits nothing), the script holds it back, and the tests run once more.
#
#   update -> e2e-1 + kind-1 + lint-1 -> (failed) fix-1 -> e2e-2 + kind-2 + lint-2 -> finish

on:
  # TEMPORARY: test runs from the feature branch (a push run is a real run). REMOVE before merging.
  push:
    branches:
      - feature/659-copilot-agent-for-automated-vulnerability-remediation-and-pr-creation
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      paths:
        description: 'Optional comma-separated manifest path prefixes for a test run. Empty = everything.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Update and check locally only; no push, no tests, no PR'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  security-events: read
  actions: read # the logs of this run's failed jobs

concurrency:
  group: dep-update
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  RUN_ID: ${{ github.run_id }}
  BRANCH: deps/update-batch-${{ github.run_id }}
  MANIFEST_PATHS: ${{ inputs.paths }}
  STATE_DIR: /tmp/dep-state
  # Inside the state folder: the later jobs get the same script with the state artifact. Their
  # checkout is the update branch, which starts from develop and may not have this script yet.
  SCRIPT: /tmp/dep-state/dependency_caps.py

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      # The agent-kernel-ci[bot] app pushes and opens the PR, so the PR's CI runs. Falls back to GITHUB_TOKEN.
      - id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yaalalabs
          repositories: agent-kernel
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: '0.13.6'
      - uses: actions/setup-node@v5
      - run: npm install -g @github/copilot

      # One update PR at a time (the #659 workflow's markers too: they edit the same files).
      - name: Check for an open update PR
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$REPO" --state open --limit 500 --json number,body \
            --jq '[.[] | select((.body // "") | test("ak-(vuln-(remediation|bulk)|dep-update)"))] | map("#\(.number)") | join(" ")')
          if [ "$DRY_RUN" = false ] && [ -n "$open" ]; then
            echo "An update PR is already open ($open). One at a time." | tee update-summary.md
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update, check, fix
        if: steps.gate.outputs.open != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_REQUEST_TOKEN }}
          # Reads Dependabot alerts until the agent-kernel-ci app has "Dependabot alerts: Read".
          ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$COPILOT_GITHUB_TOKEN" ] || { echo "COPILOT_REQUEST_TOKEN is not set."; exit 1; }
          mkdir -p "$STATE_DIR"
          cp .github/scripts/dependency_caps.py "$SCRIPT" # before the checkout of develop, which may not have it
          dep() { uv run --no-project --with packaging python "$SCRIPT" --paths "$MANIFEST_PATHS" --state "$STATE_DIR" "$@"; }
          git fetch origin develop
          git checkout --force -B "$BRANCH" origin/develop
          dep snapshot
          dep alerts
          dep cap
          dep secure
          dep update
          for round in 1 2; do
            [ "$(dep failures)" -eq 0 ] && break
            dep fix
          done
          dep finalize
          dep npm
          dep report --run-id "$RUN_ID" $([ "$DRY_RUN" = false ] || echo --dry-run)
          cp "$STATE_DIR/update-summary.md" update-summary.md

      - name: Push the branch for the tests
        id: push
        if: steps.gate.outputs.open != 'true' && env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(jq -r .has_changes "$STATE_DIR/summary.json")" != true ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "agent-kernel-ci[bot]"
          git config user.email "agent-kernel-ci[bot]@users.noreply.github.com"
          git diff --name-only | grep -E '(^|/)(pyproject\.toml|uv\.lock|package(-lock)?\.json)$' | xargs git add
          git commit -m "$(jq -r .title "$STATE_DIR/summary.json")"
          gh auth setup-git
          git push -u origin HEAD
          { echo "pushed=true"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"

      - if: steps.push.outputs.pushed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dep-state
          path: /tmp/dep-state
          retention-days: 7
          overwrite: true
      - if: always()
        run: |
          cat update-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No summary - the run stopped early." >> "$GITHUB_STEP_SUMMARY"

  # ---- Round 1: the CI jobs a PR gets, on the pushed branch ----
  e2e-1:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test-reusable.yaml
    with:
      checkout_ref: ${{ needs.update.outputs.sha }}
      run_e2e_tests: true
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WALLED_API_KEY: ${{ secrets.WALLED_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
  kind-1:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/chart-test.yaml
    with:
      checkout_ref: ${{ needs.update.outputs.sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  lint-1:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/code-quality.yml
    with:
      checkout_ref: ${{ needs.update.outputs.sha }}

  # ---- Fix: Copilot names the package behind each failed job; the script holds it back ----
  fix-1:
    needs: [update, e2e-1, kind-1, lint-1]
    if: >-
      always() && needs.update.outputs.pushed == 'true' &&
      (needs.e2e-1.result == 'failure' || needs.kind-1.result == 'failure' || needs.lint-1.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.push.outputs.changed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yaalalabs
          repositories: agent-kernel
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: '0.13.6'
      - uses: actions/setup-node@v5
      - run: npm install -g @github/copilot
      - uses: actions/download-artifact@v4
        with:
          name: dep-state
          path: /tmp/dep-state

      - name: Hold back the packages behind the failures
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_REQUEST_TOKEN }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }} # actions: read, for this run's job logs
        run: |
          set -euo pipefail
          # $SCRIPT came with the state artifact (the update branch may not have it).
          dep() { uv run --no-project --with packaging python "$SCRIPT" --paths "$MANIFEST_PATHS" --state "$STATE_DIR" "$@"; }
          echo "Failed jobs: $(dep failures --run-id "$RUN_ID" --jobs e2e-1,kind-1,lint-1)"
          dep fix
          dep finalize
          dep report --run-id "$RUN_ID"

      - name: Push the holds
        id: push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(git diff --name-only | grep -E '(^|/)(pyproject\.toml|uv\.lock)$' || true)
          if [ -z "$files" ]; then
            echo "Nothing held back: a second round would fail the same way."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "agent-kernel-ci[bot]"
          git config user.email "agent-kernel-ci[bot]@users.noreply.github.com"
          echo "$files" | xargs git add
          git commit -m "chore(deps): hold back packages that broke the tests"
          gh auth setup-git
          git push origin HEAD:"$BRANCH"
          { echo "changed=true"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-state
          path: /tmp/dep-state
          retention-days: 7
          overwrite: true
      - if: always()
        run: cat /tmp/dep-state/update-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # ---- Round 2: the same jobs again, after the holds ----
  e2e-2:
    needs: fix-1
    if: needs.fix-1.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test-reusable.yaml
    with:
      checkout_ref: ${{ needs.fix-1.outputs.sha }}
      run_e2e_tests: true
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WALLED_API_KEY: ${{ secrets.WALLED_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
  kind-2:
    needs: fix-1
    if: needs.fix-1.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/chart-test.yaml
    with:
      checkout_ref: ${{ needs.fix-1.outputs.sha }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  lint-2:
    needs: fix-1
    if: needs.fix-1.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/code-quality.yml
    with:
      checkout_ref: ${{ needs.fix-1.outputs.sha }}

  # ---- The PR only when a round passed; otherwise delete the branch and list what failed ----
  finish:
    needs: [update, e2e-1, kind-1, lint-1, fix-1, e2e-2, kind-2, lint-2]
    if: always() && needs.update.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yaalalabs
          repositories: agent-kernel
      - uses: actions/download-artifact@v4
        with:
          name: dep-state
          path: /tmp/dep-state
      - name: Open the PR, or delete the branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUND_1: ${{ needs.e2e-1.result }} ${{ needs.kind-1.result }} ${{ needs.lint-1.result }}
          ROUND_2: ${{ needs.e2e-2.result }} ${{ needs.kind-2.result }} ${{ needs.lint-2.result }}
        run: |
          set -euo pipefail
          if [ "$ROUND_1" = "success success success" ] || [ "$ROUND_2" = "success success success" ]; then
            url=$(gh pr create --repo "$REPO" --base develop --head "$BRANCH" \
              --title "$(jq -r .title "$STATE_DIR/summary.json")" --body-file "$STATE_DIR/pr-body.md")
            { echo "## PR opened: $url"; echo; cat "$STATE_DIR/update-summary.md"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          failed=$(GH_TOKEN="$ACTIONS_TOKEN" gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name' | grep -E '^- (e2e|kind|lint)-[12] / ' || true)
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
          {
            echo "## No PR: the tests still failed, so \`$BRANCH\` was deleted"
            echo "Round 1: $ROUND_1. Round 2: $ROUND_2."
            echo; echo "### Failed jobs"; echo "${failed:-(none found; a job may have been cancelled)}"
            echo; cat "$STATE_DIR/update-summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
