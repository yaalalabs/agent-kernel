name: Dependency Version Update (Copilot)

# Every two weeks: upper limits, security fixes and updates on each version line, for every manifest
# (.github/scripts/dependency_caps.py). Then unit tests and e2e. On a failure Copilot names the package
# behind each real error, the script holds it back, and the tests run once more. The PR opens when they
# pass, or when the only failures are not caused by the update (listed in the PR). After the PR opens,
# the workflows in AFTER_PR_WORKFLOWS start on its branch.
#
#   when -> update -> e2e-1 -> (failed) fix-1 -> e2e-2 -> finish

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday 03:00 UTC; the `when` job lets every second one through
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: read
  actions: read # the logs of this run's failed jobs

concurrency:
  group: dep-update
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  RUN_ID: ${{ github.run_id }}
  BRANCH: deps/update-batch-${{ github.run_id }}
  BASE_BRANCH: develop # the branch the update starts from and the PR targets
  STATE_DIR: /tmp/dep-state
  # Shipped with the state artifact: the update branch starts from $BASE_BRANCH, which may not have it yet.
  SCRIPT: /tmp/dep-state/dependency_caps.py
  # Started on the PR branch after the PR opens (not in the gate); a reviewer reads their results.
  # Each entry: <workflow file>[:<input>=<value>,...]. provision_e2e_messaging redeploys the shared Slack and
  # Telegram app from the PR branch, so those real messaging tests use the new versions.
  AFTER_PR_WORKFLOWS: chart-test.yaml integration-test-weekly.yaml:provision_e2e_messaging=true

jobs:
  # Cron cannot say "every two weeks": a scheduled run goes ahead only on even weeks since 1970.
  # Other triggers always run.
  when:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.week.outputs.run }}
    steps:
      - id: week
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ] || [ $(( $(date -u +%s) / 604800 % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Odd week: skipped (runs every two weeks)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      # The GitHub App (APP_ID) pushes and opens the PR, so the PR's CI runs. Falls back to GITHUB_TOKEN.
      - id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: '0.13.6'
      - uses: actions/setup-node@v5
      - run: npm install -g @github/copilot

      # One update PR at a time.
      - name: Check for an open update PR
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$REPO" --state open --limit 500 --json number,body \
            --jq '[.[] | select((.body // "") | test("ak-dep-update"))] | map("#\(.number)") | join(" ")')
          if [ -n "$open" ]; then
            echo "An update PR is already open ($open). One at a time." | tee update-summary.md
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update, check, fix
        if: steps.gate.outputs.open != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_REQUEST_TOKEN }}
          # Reads Dependabot alerts until the GitHub App has "Dependabot alerts: Read".
          ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$COPILOT_GITHUB_TOKEN" ] || { echo "COPILOT_REQUEST_TOKEN is not set."; exit 1; }
          mkdir -p "$STATE_DIR"
          cp .github/scripts/dependency_caps.py "$SCRIPT" # before the checkout of $BASE_BRANCH, which may not have it
          dep() { uv run --no-project --with packaging python "$SCRIPT" --state "$STATE_DIR" "$@"; }
          git fetch origin "$BASE_BRANCH"
          git checkout --force -B "$BRANCH" "origin/$BASE_BRANCH"
          dep snapshot
          dep alerts
          dep cap
          dep secure
          dep update
          for round in 1 2; do
            [ "$(dep failures)" -eq 0 ] && break
            dep fix
          done
          dep finalize
          dep npm
          dep report --run-id "$RUN_ID"
          cp "$STATE_DIR/update-summary.md" update-summary.md

      - name: Push the branch for the tests
        id: push
        if: steps.gate.outputs.open != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          BOT: ${{ steps.app-token.outputs.app-slug || 'github-actions' }}
        run: |
          set -euo pipefail
          if [ "$(jq -r .has_changes "$STATE_DIR/summary.json")" != true ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "$BOT[bot]"
          git config user.email "$BOT[bot]@users.noreply.github.com"
          git diff --name-only | grep -E '(^|/)(pyproject\.toml|uv\.lock|package(-lock)?\.json)$' | xargs git add
          git commit -m "$(jq -r .title "$STATE_DIR/summary.json")"
          gh auth setup-git
          git push -u origin HEAD
          { echo "pushed=true"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"

      - if: steps.push.outputs.pushed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dep-state
          path: /tmp/dep-state
          retention-days: 7
          overwrite: true
      - if: always()
        run: |
          cat update-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No summary - the run stopped early." >> "$GITHUB_STEP_SUMMARY"

  # ---- Round 1: unit tests and e2e (test-reusable.yaml), on the pushed branch ----
  e2e-1:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test-reusable.yaml
    with:
      checkout_ref: ${{ needs.update.outputs.sha }}
      run_e2e_tests: true
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WALLED_API_KEY: ${{ secrets.WALLED_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}

  # ---- Fix: Copilot names the package behind each failed job; the script holds it back ----
  fix-1:
    needs: [update, e2e-1]
    if: always() && needs.update.outputs.pushed == 'true' && needs.e2e-1.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write # this run's job logs; delete round 1's ak-py-dist before round 2 uploads it again
    outputs:
      changed: ${{ steps.push.outputs.changed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: '0.13.6'
      - uses: actions/setup-node@v5
      - run: npm install -g @github/copilot
      - uses: actions/download-artifact@v4
        with:
          name: dep-state
          path: /tmp/dep-state

      - name: Hold back the packages behind the failures
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_REQUEST_TOKEN }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }} # actions: read, for this run's job logs
        run: |
          set -euo pipefail
          dep() { uv run --no-project --with packaging python "$SCRIPT" --state "$STATE_DIR" "$@"; }
          echo "Failed jobs: $(dep failures --run-id "$RUN_ID" --jobs e2e-1)"
          dep fix
          dep finalize
          dep report --run-id "$RUN_ID"

      - name: Push the holds
        id: push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT: ${{ steps.app-token.outputs.app-slug || 'github-actions' }}
        run: |
          set -euo pipefail
          files=$(git diff --name-only | grep -E '(^|/)(pyproject\.toml|uv\.lock)$' || true)
          if [ -z "$files" ]; then
            echo "Nothing held back: a second round would fail the same way."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "$BOT[bot]"
          git config user.email "$BOT[bot]@users.noreply.github.com"
          echo "$files" | xargs git add
          git commit -m "chore(deps): hold back packages that broke the tests"
          gh auth setup-git
          git push origin HEAD:"$BRANCH"
          { echo "changed=true"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"
          # Round 2 calls test-reusable.yaml again in this run, which uploads ak-py-dist again.
          artifacts="repos/$REPO/actions/runs/$RUN_ID/artifacts?name=ak-py-dist"
          for id in $(GH_TOKEN="$ACTIONS_TOKEN" gh api "$artifacts" --jq '.artifacts[].id'); do
            GH_TOKEN="$ACTIONS_TOKEN" gh api -X DELETE "repos/$REPO/actions/artifacts/$id" ||
              echo "::warning::could not delete ak-py-dist ($id); round 2 may fail to upload it"
          done

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-state
          path: /tmp/dep-state
          retention-days: 7
          overwrite: true
      - if: always()
        run: cat /tmp/dep-state/update-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # ---- Round 2: the same tests again, after the holds ----
  e2e-2:
    needs: fix-1
    # always(): without it GitHub adds success(), which checks every earlier job, and round 1 failed.
    if: always() && needs.fix-1.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test-reusable.yaml
    with:
      checkout_ref: ${{ needs.fix-1.outputs.sha }}
      run_e2e_tests: true
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WALLED_API_KEY: ${{ secrets.WALLED_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}

  # ---- The PR when a round passed (or only uncaused failures are left); else delete the branch ----
  finish:
    needs: [update, e2e-1, fix-1, e2e-2]
    if: always() && needs.update.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # read this run's jobs; start $AFTER_PR_WORKFLOWS on the PR branch
    steps:
      - id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: dep-state
          path: /tmp/dep-state
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
      - name: Open the PR, or delete the branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUND_1: ${{ needs.e2e-1.result }}
          ROUND_2: ${{ needs.e2e-2.result }}
        run: |
          set -euo pipefail
          green=false
          if [ "$ROUND_1" = success ] || [ "$ROUND_2" = success ]; then
            green=true
          else
            # Failures the update did not cause do not block; the script lists them in the PR body.
            ok=$(GH_TOKEN="$ACTIONS_TOKEN" uv run --no-project --with packaging python "$SCRIPT" \
              --state "$STATE_DIR" verdict --run-id "$RUN_ID" --jobs e2e-1 --retry-jobs e2e-2) || ok=false
            echo "verdict: $ok"; cat "$STATE_DIR/verdict.json" || true
            [ "$ok" != true ] || green=true
          fi
          if [ "$green" = true ]; then
            url=$(gh pr create --repo "$REPO" --base "$BASE_BRANCH" --head "$BRANCH" \
              --title "$(jq -r .title "$STATE_DIR/summary.json")" --body-file "$STATE_DIR/pr-body.md")
            { echo "## PR opened: $url"; echo; cat "$STATE_DIR/update-summary.md"; } >> "$GITHUB_STEP_SUMMARY"
            # Started on the PR branch; a failure to start never undoes the PR, it is only reported.
            note=""
            for entry in $AFTER_PR_WORKFLOWS; do
              workflow=${entry%%:*} inputs=()
              if [ "$entry" != "$workflow" ]; then
                IFS=, read -ra pairs <<< "${entry#*:}"
                for pair in "${pairs[@]}"; do inputs+=(-f "$pair"); done
              fi
              runs="https://github.com/$REPO/actions/workflows/$workflow?query=branch%3A$BRANCH"
              if GH_TOKEN="$ACTIONS_TOKEN" gh workflow run "$workflow" --repo "$REPO" --ref "$BRANCH" "${inputs[@]}"; then
                note+="- Started \`$workflow\` on this branch: [its runs]($runs)."$'\n'
              else
                note+="- Could not start \`$workflow\`; start it by hand on this branch."$'\n'
                echo "::warning::could not start $workflow"
              fi
            done
            if [ -n "$note" ]; then
              note+="Check them before merging."
              gh pr comment "$url" --body "$note" || echo "::warning::could not comment on $url"
              echo "$note" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          failed=$(GH_TOKEN="$ACTIONS_TOKEN" gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name' | grep -E '^- e2e-[12] / ' || true)
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
          if [ "$ROUND_2" = skipped ]; then
            why="round 1 had failures that were neither held back nor explained (or the fix job failed)"
          else
            why="the tests still failed after the holds, with failures this update may have caused"
          fi
          {
            echo "## No PR: $why, so \`$BRANCH\` was deleted"
            echo "Round 1: $ROUND_1. Round 2: $ROUND_2."
            echo; echo "### Failed jobs"; echo "${failed:-(none found; a job may have been cancelled)}"
            echo; echo "### Blocking (not explained)"; jq -r '.blocking[]?' "$STATE_DIR/verdict.json" 2>/dev/null || true
            echo; cat "$STATE_DIR/update-summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
