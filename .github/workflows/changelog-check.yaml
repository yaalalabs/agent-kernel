name: Changelog Check

# Requires a changelog fragment under changelog.d/ on PRs with a user-visible change (#664).
# The rules live in scripts/changelog_fragments.py (PullRequestPolicy) and CONTRIBUTING.md,
# "Changelog entries": feat, fix, perf, refactor, build and chore PRs add a fragment or update a
# pending one; a "!" title adds a breaking one; docs, test, ci and style PRs, bot PRs and PRs with
# the maintainer-only no-changelog label need none; an invalid fragment name always fails.
# publish.yaml compiles the fragments into CHANGELOG.md at release time.
#
# `edited` re-runs the check after a title change; `labeled`/`unlabeled` after no-changelog is
# added or removed. `synchronize` is included because a required check must re-report on every
# new head SHA.

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

# Read-only: the job only reads the PR's own files and diff, so it runs the same on fork PRs.
permissions:
  contents: read

concurrency:
  group: changelog-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-changelog:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The PR's merge commit and its two parents: the base it was merged onto and the PR head.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Here, not in test-reusable.yaml's script-tests: that job also runs from privileged triggers on a
      # checkout_ref, which CodeQL flags (actions/cache-poisoning/poisonable-step); this workflow runs only on
      # pull_request with a read-only token. Testing first also means a broken script fails the check
      # instead of deciding it.
      - name: Test the changelog fragment script
        working-directory: scripts
        run: python test_changelog_fragments.py

      - name: Check the changelog fragment
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # HEAD is the PR's merge commit and HEAD^1 the develop commit it was merged onto, so the
          # diff is exactly what the PR changes. Not pull_request.base.sha: it is the base as of the
          # PR's last push, so on a later labeled or edited run it would also count fragments other
          # PRs have merged since. -z keeps raw file names, so an odd one still reaches validation.
          mapfile -d '' -t ADDED < <(git diff -z --name-only --diff-filter=AR HEAD^1 HEAD -- changelog.d/)
          mapfile -d '' -t MODIFIED < <(git diff -z --name-only --diff-filter=M HEAD^1 HEAD -- changelog.d/)
          # --option=value so a title or label starting with "-" is not read as a flag.
          python scripts/changelog_fragments.py check-pr \
            --title="$PR_TITLE" \
            --author="$PR_AUTHOR" \
            --labels="$PR_LABELS" \
            --added "${ADDED[@]}" \
            --modified "${MODIFIED[@]}"

      - name: Preview the next release's changelog
        if: always()
        run: |
          # Renders every pending fragment the way publish.yaml will, so a fragment that towncrier
          # cannot render fails here rather than at release time.
          pip install --quiet uv
          {
            echo "<details><summary>Next release's changelog with this PR merged</summary>"
            echo
            uvx --quiet towncrier@26.9.0 build --draft --version next
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
