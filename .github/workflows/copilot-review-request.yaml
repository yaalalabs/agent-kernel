name: Request Copilot Review

# Requests a GitHub Copilot code review on a pull request when a maintainer adds the
# "Request Copilot" label to it. Nothing is requested automatically.
#
# Why: the Protect Develop ruleset already carries a copilot_code_review rule, but ruleset-driven
# reviews only fire when the PR author holds a Copilot license (the review is billed to the
# author). For every other author a maintainer had to click "request review from Copilot" by
# hand. This workflow makes that request with COPILOT_REVIEW_PAT, a fine-grained PAT created by
# a licensed maintainer, so the review is billed to that license instead. It skips PRs where
# Copilot is already a requested reviewer, so licensed authors are not double-requested.
#
# The label is the opt-in: each review is a premium request billed to the PAT owner's license,
# so it is spent only when someone with triage access or higher (the only people who can apply
# labels) decides a PR is worth it. That replaces the earlier per-PR automation and its
# collaborator check: a maintainer reads the PR, then labels it. Collaborator, bot-authored and
# outside contributor PRs all get a review the same way. To request another review after new
# commits, remove the label and add it again; the workflow only fires on the `labeled` event.
# The label must exist in the repository: gh label create "Request Copilot".
#
# COPILOT_REVIEW_PAT requirements:
#   - created by a maintainer who holds a Copilot license (the request runs as that user)
#   - resource owner: the yaalalabs organization; repository access: this repository only
#   - repository permission "Pull requests: Read and write"
#   - approved by an org owner if the org requires fine-grained PAT approval
# This is deliberately not COPILOT_REQUEST_TOKEN (used by auto-sync-skills-docs.yaml): that one
# carries the account-level "Copilot Requests" permission, which GitHub only allows on
# user-owned tokens, and a user-owned token cannot hold repository permissions on an org repo.
# A 403 "Resource not accessible by personal access token" from this workflow means the token
# is user-owned, read-only, or still pending org approval.
#
# `pull_request_target` is used deliberately: contributors often work from forks and the plain
# `pull_request` event does not expose secrets to fork PRs. The job never checks out or executes
# PR code, it only calls the pulls API, so the untrusted-checkout hazard that normally comes
# with pull_request_target does not apply. Keep it that way.

on:
  pull_request_target:
    types: [labeled]

# Least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions). Every API call is
# made with the PAT, so the default token needs no scopes at all.
permissions: {}

jobs:
  request-review:
    # Skip the runner entirely for any other label. Expression `==` is case-insensitive for
    # strings, matching GitHub's own label-name uniqueness rule.
    if: github.event.label.name == 'Request Copilot'
    runs-on: ubuntu-latest
    steps:
      - name: Check COPILOT_REVIEW_PAT is configured
        env:
          COPILOT_REVIEW_PAT: ${{ secrets.COPILOT_REVIEW_PAT }}
        run: |
          if [ -z "$COPILOT_REVIEW_PAT" ]; then
            echo "::error::COPILOT_REVIEW_PAT secret is not configured. As a Copilot license holder, create a fine-grained PAT with resource owner yaalalabs, access to this repository, and 'Pull requests: Read and write', then store it as COPILOT_REVIEW_PAT."
            exit 1
          fi

      - name: Request review from Copilot
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL_NAME: ${{ github.event.label.name }}
          LABELED_BY: ${{ github.event.sender.login }}
        with:
          github-token: ${{ secrets.COPILOT_REVIEW_PAT }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            // Reviewer identifier documented by GitHub for REST review requests. Once requested,
            // Copilot is a Bot reviewer (login copilot-pull-request-reviewer, shown as "Copilot").
            // REST pull request payloads list only User reviewers in requested_reviewers, so a
            // pending Copilot request is invisible there. GraphQL's reviewRequests types Bot
            // reviewers explicitly, so that is where the request is checked, before and after.
            const COPILOT_REVIEWER = 'copilot-pull-request-reviewer[bot]';
            const isCopilot = (login) => /copilot/i.test(login || '');
            const copilotStatus = async () => {
              const result = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewRequests(first: 100) {
                        nodes { requestedReviewer { __typename ... on Bot { login } ... on User { login } } }
                      }
                      reviews(last: 100) { nodes { author { login } } }
                    }
                  }
                }`,
                { owner, repo, number: pull_number },
              );
              const node = result.repository.pullRequest;
              return {
                requested: node.reviewRequests.nodes.some((n) => n.requestedReviewer && isCopilot(n.requestedReviewer.login)),
                reviewed: node.reviews.nodes.some((n) => n.author && isCopilot(n.author.login)),
              };
            };

            if (!Number.isInteger(pull_number) || pull_number <= 0) {
              core.setFailed(`Invalid pull request number: '${process.env.PR_NUMBER}'`);
              return;
            }

            core.info(`'${process.env.LABEL_NAME}' added to #${pull_number} by ${process.env.LABELED_BY}.`);

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== 'open') {
              core.info(`PR #${pull_number} is ${pr.state}; nothing to request.`);
              return;
            }

            // The develop ruleset already requests Copilot for licensed authors; don't double up.
            if ((await copilotStatus()).requested) {
              core.info(`Copilot is already a requested reviewer on #${pull_number}; nothing to do.`);
              return;
            }

            try {
              const { status } = await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: [COPILOT_REVIEWER],
              });
              // The REST response omits Bot reviewers, so verify through GraphQL. A review that
              // is already submitted counts too, in case Copilot finished before this check ran.
              const after = await copilotStatus();
              if (!after.requested && !after.reviewed) {
                core.setFailed(`Request returned HTTP ${status} but Copilot is not a requested reviewer of #${pull_number}. Check that Copilot code review is enabled for this repository.`);
                return;
              }
              core.info(`Requested Copilot review on #${pull_number}.`);
            } catch (error) {
              core.setFailed(
                `Could not request a Copilot review on #${pull_number} (HTTP ${error.status}): ${error.message}. ` +
                  `COPILOT_REVIEW_PAT must be a fine-grained PAT created by a Copilot license holder with resource owner ${owner}, ` +
                  `access to ${owner}/${repo}, and "Pull requests: Read and write", approved by an org owner if required. ` +
                  `A 403 means the token is user-owned, read-only, or still pending approval.`,
              );
            }
