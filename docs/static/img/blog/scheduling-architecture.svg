<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 620" width="1050" height="620" role="img" aria-label="Agent Kernel scheduling architecture: chat requests, agent tools and management routes all reach one ScheduleManager, which persists a record in a ScheduleStore and registers a timer with a ScheduleProvider; the provider fires each occurrence into the input queue, where the ordinary agent runner executes it.">
  <defs>
    <style>
      .t   { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .h   { font-size: 13px; font-weight: 700; }
      .ttl { font-size: 12px; font-weight: 700; fill: #1f2933; }
      .sub { font-size: 11px; fill: #3e4c59; }
      .row { font-size: 11px; fill: #1f2933; }
      .hint{ font-size: 10px; fill: #6b7280; }
      .lbl { font-size: 10px; }
    </style>
    <marker id="ar-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#6c8ebf"/>
    </marker>
    <marker id="ar-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#82b366"/>
    </marker>
    <marker id="ar-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#d79b00"/>
    </marker>
    <marker id="ar-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#9673a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1050" height="620" fill="#ffffff"/>

  <!-- ========== column headings ========== -->
  <g class="t h" text-anchor="middle">
    <text x="150" y="80" fill="#4d6fa8">Ways in</text>
    <text x="505" y="80" fill="#7a5c91">One service façade</text>
    <text x="890" y="80" fill="#5e8a50">Pluggable backends</text>
  </g>

  <!-- ========== ways in ========== -->
  <g>
    <rect x="30" y="100" width="240" height="68" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <g class="t" text-anchor="middle">
      <text class="ttl" x="150" y="121">Chat request with a schedule block</text>
      <text class="sub" x="150" y="136">POST /api/v1/chat → 202 Accepted</text>
      <text class="hint" x="150" y="150">registered, not run</text>
    </g>

    <rect x="30" y="184" width="240" height="68" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <g class="t" text-anchor="middle">
      <text class="ttl" x="150" y="205">Agent tools</text>
      <text class="sub" x="150" y="220">create_schedule · list_schedules</text>
      <text class="sub" x="150" y="234">get / update / delete_schedule</text>
    </g>

    <rect x="30" y="268" width="240" height="68" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <g class="t" text-anchor="middle">
      <text class="ttl" x="150" y="289">Management routes</text>
      <text class="sub" x="150" y="304">GET / PUT / DELETE /api/v1/schedules</text>
      <text class="hint" x="150" y="318">optional, behind an Authoriser</text>
    </g>
  </g>

  <!-- ========== ScheduleManager ========== -->
  <rect x="380" y="100" width="250" height="236" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text class="t" x="505" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">ScheduleManager</text>

  <g>
    <rect x="396" y="136" width="218" height="42" rx="3" fill="#ffffff" stroke="#9673a6" stroke-width="1"/>
    <text class="t row" x="406" y="153">Validates the occurrence rule</text>
    <text class="t hint" x="406" y="167">at · cron · timezone — bad rules fail here</text>

    <rect x="396" y="186" width="218" height="42" rx="3" fill="#ffffff" stroke="#9673a6" stroke-width="1"/>
    <text class="t row" x="406" y="203">Enforces ownership</text>
    <text class="t hint" x="406" y="217">every task belongs to a user_id</text>

    <rect x="396" y="236" width="218" height="42" rx="3" fill="#ffffff" stroke="#9673a6" stroke-width="1"/>
    <text class="t row" x="406" y="253">Orders the two writes</text>
    <text class="t hint" x="406" y="267">store first, provider second</text>

    <rect x="396" y="286" width="218" height="42" rx="3" fill="#ffffff" stroke="#9673a6" stroke-width="1"/>
    <text class="t row" x="406" y="303">Freezes the trigger body</text>
    <text class="t hint" x="406" y="317">what each occurrence will deliver</text>
  </g>

  <!-- ========== backends ========== -->
  <rect x="760" y="100" width="260" height="68" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <g class="t" text-anchor="middle">
    <text class="ttl" x="890" y="129">ScheduleStore — the record</text>
    <text class="sub" x="890" y="146">in_memory · redis · valkey · dynamodb</text>
  </g>

  <rect x="760" y="244" width="260" height="76" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <g class="t" text-anchor="middle">
    <text class="ttl" x="890" y="269">ScheduleProvider — the timer</text>
    <text class="sub" x="890" y="284">local (in-process thread)</text>
    <text class="sub" x="890" y="298">eventbridge (AWS EventBridge Scheduler)</text>
  </g>

  <!-- ========== execution ========== -->
  <rect x="760" y="430" width="260" height="72" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <g class="t" text-anchor="middle">
    <text class="ttl" x="890" y="460">Input Queue</text>
    <text class="sub" x="890" y="477">in_memory · SQS</text>
  </g>

  <rect x="380" y="430" width="250" height="72" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <g class="t" text-anchor="middle">
    <text class="ttl" x="505" y="460">Agent Runner</text>
    <text class="sub" x="505" y="477">the ordinary execution path</text>
  </g>

  <rect x="30" y="430" width="240" height="72" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <g class="t" text-anchor="middle">
    <text class="ttl" x="150" y="460">Your agent runs</text>
    <text class="sub" x="150" y="477">unchanged agent code</text>
  </g>

  <!-- ========== edges ========== -->
  <g fill="none" stroke-width="2">
    <path d="M270,134 H345 V159 H377" stroke="#6c8ebf" marker-end="url(#ar-blue)"/>
    <path d="M270,218 H377" stroke="#6c8ebf" marker-end="url(#ar-blue)"/>
    <path d="M270,302 H345 V277 H377" stroke="#6c8ebf" marker-end="url(#ar-blue)"/>

    <path d="M630,134 H757" stroke="#82b366" marker-end="url(#ar-green)"/>
    <path d="M630,282 H757" stroke="#82b366" marker-end="url(#ar-green)"/>

    <path d="M890,320 V427" stroke="#d79b00" marker-end="url(#ar-orange)"/>
    <path d="M760,466 H633" stroke="#d79b00" marker-end="url(#ar-orange)"/>
    <path d="M380,466 H273" stroke="#d79b00" marker-end="url(#ar-orange)"/>

    <path d="M505,430 V339" stroke="#9673a6" stroke-dasharray="6 4" marker-end="url(#ar-purple)"/>
  </g>

  <!-- ========== edge labels ========== -->
  <g class="t lbl">
    <text x="694" y="128" text-anchor="middle" fill="#5e8a50">1. persist the record</text>
    <text x="694" y="276" text-anchor="middle" fill="#5e8a50">2. register the timer</text>

    <text x="876" y="360" text-anchor="end" fill="#a06800">fires an occurrence as a</text>
    <text x="876" y="374" text-anchor="end" fill="#a06800">plain chat request — no schedule key</text>

    <text x="517" y="388" text-anchor="start" fill="#7a5c91">records the occurrence</text>
  </g>

  <!-- ========== note ========== -->
  <rect x="30" y="540" width="990" height="56" rx="7" fill="#f5f5f5" stroke="#b3b3b3" stroke-width="1"/>
  <g class="t" text-anchor="middle">
    <text x="525" y="563" font-size="11" font-weight="700" fill="#3e4c59">Pick a pair that matches where you run.</text>
    <text x="525" y="580" font-size="11" fill="#4d4d4d">Laptop: local + in_memory store + in_memory queue, all one process.   ·   Production on AWS: eventbridge + dynamodb + SQS.   ·   An unusable pairing fails at startup, not at the first request.</text>
  </g>
</svg>
