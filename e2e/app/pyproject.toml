[project]
name = "ak-e2e-messaging-app"
version = "0.1.0"
description = "Agent Kernel end-to-end test deployment: one OpenAI agent exposed via every messaging integration on AWS ECS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[api,openai,slack,telegram,gmail,whatsapp,messenger,instagram,teams]>=0.10.0",
    "aiohttp>=3.14.4,<4.0.0",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "isort>=5.0.0,<9.0.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py312"]
