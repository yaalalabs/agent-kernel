# chart-testing configuration for the Agent Kernel chart.
#
#   ct lint --config ak-deployment/ak-k8s/ci/ct.yaml
#   ct install --config ak-deployment/ak-k8s/ci/ct.yaml   # on a kind cluster
#
# ct lints/installs the chart once per ci/*-values.yaml file found in the chart directory;
# the kind smoke values live in chart/ci/ for that reason.
chart-dirs:
  - ak-deployment/ak-k8s
charts:
  - ak-deployment/ak-k8s/chart
validate-maintainers: false
check-version-increment: false
target-branch: develop
helm-extra-args: --timeout 600s
