apiVersion: v2
name: agent-kernel
# The description is what GitHub shows on the GHCR package page (via the
# org.opencontainers.image.description annotation helm push derives from it), next to a
# "docker pull" box that does not apply to charts, so it leads with the real install command.
# scripts/update_chart_versions.py pins the versions in it to each release.
description: >-
  Agent Kernel queue-execution pipeline on Kubernetes. Install with Helm, not docker pull:
  helm pull oci://ghcr.io/yaalalabs/charts/agent-kernel --version 0.9.5 --untar
  (unpacks the flavor values files), then
  helm install ak oci://ghcr.io/yaalalabs/charts/agent-kernel --version 0.9.5
  -f agent-kernel/values-<flavor>.yaml (flavors: dev, baremetal, eks).
  Deploys an io-handler Deployment (Request + Response Handler), an agent-runner Deployment,
  and an optional WebSocket gateway tier, with condition-gated Valkey and NATS backing
  services. Guide: https://kernel.yaala.ai/docs/deployment/onprem-kubernetes
type: application
# Both versions are the Agent Kernel release the chart ships with:
# scripts/update_chart_versions.py pins them to each release before the tag is cut, and
# publish-chart.yaml stamps them from the tag at package time as well, so a checkout renders
# the same chart labels and NOTES as the published artifact.
version: 0.9.5
appVersion: "0.9.5"
kubeVersion: ">=1.29.0-0"
home: https://github.com/yaalalabs/agent-kernel
sources:
  - https://github.com/yaalalabs/agent-kernel
keywords:
  - agent-kernel
  - agents
  - llm
dependencies:
  - name: valkey
    version: 0.11.0
    repository: https://valkey-io.github.io/valkey-helm/
    condition: valkey.enabled
  - name: nats
    version: 2.14.5
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
