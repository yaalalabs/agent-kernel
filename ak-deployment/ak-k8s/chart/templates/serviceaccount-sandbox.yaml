{{- if .Values.sandboxWorker.enabled }}
{{/*
The chart's first ServiceAccounts (#503). The worker SA is the identity the broker worker
uses against the Kubernetes API (bound by rbac-sandbox.yaml); the sandbox-pod SA is the
identity sandbox pods run as, and is deliberately bound to nothing here: what sandbox pods
may do is application policy (bind it to `view` or a custom role in your app manifests).
*/}}
{{- if .Values.sandboxWorker.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-kernel.sandboxWorkerServiceAccountName" . }}
  labels:
    {{- include "agent-kernel.labels" (dict "root" . "component" "sandbox-worker") | nindent 4 }}
{{- end }}
{{- if .Values.sandboxWorker.sandboxPods.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-kernel.sandboxPodServiceAccountName" . }}
  namespace: {{ include "agent-kernel.sandboxPodsNamespace" . }}
  labels:
    {{- include "agent-kernel.labels" (dict "root" . "component" "sandbox-pod") | nindent 4 }}
{{- end }}
{{- end }}
