{{- if and .Values.wsGateway.enabled (not .Values.wsGateway.auth.existingSecret) }}
{{/*
The shared secret behind /internal/push: gateway pods accept a reply push only when the
Response Handler presents it. Provide wsGateway.auth.token, or manage the Secret yourself and
point wsGateway.auth.existingSecret at it (key: push-auth-token).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-kernel.fullname" . }}-push-token
  labels:
    {{- include "agent-kernel.labels" (dict "root" . "component" "ws-gateway") | nindent 4 }}
type: Opaque
stringData:
  push-auth-token: {{ required "wsGateway.auth.token is required when wsGateway.enabled (or set wsGateway.auth.existingSecret)" .Values.wsGateway.auth.token | quote }}
{{- end }}
