{{- if .Values.gateway.enabled }}
{{/*
Gateway API entry (Standard channel). The implementation behind gateway.className is a
documented prerequisite: Envoy Gateway on baremetal, AWS Load Balancer Controller on EKS.
TLS via cert-manager: annotate with cert-manager.io/cluster-issuer and it fills
gateway.tls.secretName.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "agent-kernel.fullname" . }}
  labels:
    {{- include "agent-kernel.labels" (dict "root" . "component" "gateway") | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      port: {{ .Values.gateway.http.port }}
      protocol: HTTP
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.gateway.tls.enabled }}
    - name: https
      port: {{ .Values.gateway.tls.port }}
      protocol: HTTPS
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ required "gateway.tls.secretName is required when gateway.tls.enabled" .Values.gateway.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
