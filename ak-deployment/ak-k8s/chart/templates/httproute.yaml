{{- if .Values.gateway.enabled }}
{{/*
REST route to the io tier. The WebSocket route below is separate so it can carry raised
timeouts; request buffering must never be enabled on it (Envoy Gateway deadlocks buffered
WebSocket upgrades: envoyproxy/gateway#8578).
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agent-kernel.fullname" . }}-rest
  labels:
    {{- include "agent-kernel.labels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "agent-kernel.fullname" . }}
  {{- with .Values.gateway.hostname }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "agent-kernel.fullname" . }}-io
          port: 80
{{- if .Values.wsGateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agent-kernel.fullname" . }}-websocket
  labels:
    {{- include "agent-kernel.labels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "agent-kernel.fullname" . }}
  {{- with .Values.gateway.hostname }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.websocket.path }}
      # Agent streams are long-lived; "0s" disables the route timeout.
      timeouts:
        request: {{ .Values.gateway.websocket.requestTimeout | quote }}
      backendRefs:
        - name: {{ include "agent-kernel.fullname" . }}-ws-gateway
          port: {{ .Values.wsGateway.port }}
{{- end }}
{{- end }}
