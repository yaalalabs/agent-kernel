services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      SCOPEWISE_DATA: /app/data
      SCOPEWISE_MODEL_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - scopewise_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 96
  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    environment:
      SCOPEWISE_DOMAIN: ${SCOPEWISE_DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  scopewise_data:
  caddy_data:
  caddy_config:
