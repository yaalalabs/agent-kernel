# Developmental screening schedule.
#
# THIS TABLE REQUIRES CLINICIAN REVIEW BEFORE ANY REAL-WORLD USE.
#
# Ten screening points from 2 to 60 months, keyed by the child's age in calendar months:
#   visit_date = add_months(child_dob, age_months)
#
# Four of these points carry no immunisation: 24, 48 and 60 months, and they are the reason
# this schedule is modelled separately. A mother told only about immunisation visits would
# never hear about them, and the 60-month point is the school-entry assessment.
#
# ---------------------------------------------------------------------------
# PROVENANCE
#
# Sourcing rules, enforced by provenance_test.py:
#   - Never cite Scribd or any re-upload. Get the .gov.lk original, or do not
#     use the value.
#   - Two sources per value. If they disagree, the newer official one wins and
#     the discrepancy is noted here.
#   - Check the date printed ON THE FACE of the document, not its file
#     metadata.
#
# `status` must be exactly `sourced` before any value here is used.
# ---------------------------------------------------------------------------
provenance:
  source: TODO # exact document title; the screening tool incorporated into the CHDR
  publisher: "Ministry of Health, Sri Lanka"
  document_date: TODO # as printed on the document, not the file metadata
  url: TODO # direct .gov.lk link
  retrieved: TODO # YYYY-MM-DD
  cross_checked_against: TODO # second source, or "CHDR, physical copy"
  clinician_review: "NOT PERFORMED. See Known Limitations in README.md."

