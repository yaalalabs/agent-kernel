# Multiple micronutrient (MMN) supplementation schedule.
#
# THIS TABLE REQUIRES CLINICIAN REVIEW BEFORE ANY REAL-WORLD USE.
#
# Each entry is a SUPPLEMENTATION PERIOD, not a single appointment. `age_months` is when the
# period starts and `duration_days` is how long it runs:
#   start_date = add_months(child_dob, age_months)
#
# This is the only schedule in the project whose items have duration. Anything presenting
# these to a mother must say "starting on" rather than naming an appointment date, or it will
# read as a clinic visit that does not exist.
#
# ---------------------------------------------------------------------------
# PROVENANCE
#
# Sourcing rules, enforced by provenance_test.py:
#   - Never cite Scribd or any re-upload. Get the .gov.lk original, or do not
#     use the value.
#   - Two sources per value. If they disagree, the newer official one wins and
#     the discrepancy is noted here.
#   - Check the date printed ON THE FACE of the document, not its file
#     metadata.
#
# `status` must be exactly `sourced` before any value here is used.
# ---------------------------------------------------------------------------
provenance:
  source: "National Strategy for Prevention and Control of Micronutrient Deficiencies in Sri Lanka 2017-2022"
  publisher: "Nutrition Division, Ministry of Health, Sri Lanka"
  document_date: TODO # cover date not yet confirmed; the title spans 2017-2022
  url: "https://nutrition.health.gov.lk/wp-content/uploads/2020/11/National-Strategy-for-Prevention-and-Control-of-Micronutrient-Deficiencies-in-Sri-Lanka-2017-2022.pdf"
  retrieved: TODO # YYYY-MM-DD
  cross_checked_against: TODO # second source, or "CHDR, physical copy"
  clinician_review: "NOT PERFORMED. See Known Limitations in README.md."

# ---------------------------------------------------------------------------
# WHY THIS IS `placeholder`
#
# The regime below is for the standard term / normal-birth-weight pathway only. Low
# birth weight and preterm infants follow a different regime that this project does not
# model and does not store the data to identify. Presenting this schedule to the mother of a
# preterm infant would be wrong, and nothing here currently prevents that.
#
# Resolve that before flipping to `sourced`, along with the outstanding provenance fields.
# ---------------------------------------------------------------------------
status: placeholder

# Surfaced with the schedule wherever it is presented. This regime is not universal, and the
# system stores nothing that could identify a child it does not apply to.
caveat: >-
  This supplementation regime is for babies born at term and at a normal birth weight. Babies
  born early or small follow a different one. Please check with your PHM before following it.

visits:
