# Maternal and newborn danger-sign reference table.
#
# TODO: POPULATE FROM MINISTRY OF HEALTH AND WHO DANGER-SIGN PATIENT EDUCATION MATERIAL.
# THIS TABLE REQUIRES CLINICIAN REVIEW BEFORE ANY REAL-WORLD USE.
#
# Every entry below is a structural placeholder. None of it is clinical guidance, none of
# the keywords are real danger signs, and none of the action strings may be shown to a
# mother as advice.
#
# While `status` is `placeholder`, screen_danger_signs treats EVERY reported symptom as
# `red` and escalates. That is deliberate: an unpopulated table must fail toward
# escalation, never toward reassurance.
#
# Severity is decided in Python by keyword matching. The model passes the mother's raw
# text through and receives a severity it cannot override.
#
# Severity values are restricted to `red` and `amber`.
#   red   -> escalate to the assigned PHM in the same turn
#   amber -> advise, do not escalate
# `green` is a system-level state meaning no symptom was reported at all. It is never a
# value in this table, so do not add it here.
#
# Keywords must include common Sinhala and Tamil transliterations alongside English.
# Matching is case-insensitive and word-boundary based.

# ---------------------------------------------------------------------------
# PROVENANCE
#
# Sourcing rules, enforced by provenance_test.py:
#   - Never cite Scribd or any re-upload. Get the .gov.lk original, or do not
#     use the value. Copies of these documents are on Scribd and are convenient;
#     they are unverifiable re-uploads of unknown vintage.
#   - Two sources per value. If they disagree, the newer official one wins and
#     the discrepancy is noted here.
#   - Check the date printed ON THE FACE of the document, not its file
#     metadata. An old-but-official document is more dangerous than an
#     obviously unofficial one.
#
# `status` must be exactly `sourced` before any value here is used. Anything
# else, including a typo, is treated as `placeholder` and fails toward
# escalation. Setting `sourced` requires every provenance field below to be
# filled in; the test suite will fail otherwise.
# ---------------------------------------------------------------------------
