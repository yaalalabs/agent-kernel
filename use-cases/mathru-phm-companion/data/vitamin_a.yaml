# ---------------------------------------------------------------------------
# DISCREPANCY - UNRESOLVED. THIS IS WHY THE FILE IS STILL `placeholder`.
#
# The two available readings do not agree, and this is not a rounding difference:
#
#   A. The national strategy states Vitamin A every 6 months from 6 months through 5 years.
#      Expanded, that is 6, 12, 18, 24, 30, 36, 42, 48, 54, 60 months. Ten doses.
#   B. Reported service data shows administration at 6, 18 and 36 months. Three doses.
#
# Reading B is 12-month spacing where reading A is 6-month spacing. One of these is the
# policy and the other may be what is actually delivered, or B may be an incomplete
# extract - that cannot be determined from the sources to hand.
#
# The entries below encode reading A, because a stated national recommendation is the
# stronger claim, and they are a mechanical expansion of its "every 6 months from 6 months
# through 5 years", not a judgement about dosing. The three ages that also appear in reading
# B are marked. DO NOT flip this file to `sourced` until the discrepancy is resolved against
# the CHDR booklet or a current Nutrition Division guideline.
# ---------------------------------------------------------------------------
